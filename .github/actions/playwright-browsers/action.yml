name: Navegadores de Playwright
description: Instala Chromium para Playwright reutilizando la caché de navegadores.

runs:
  using: composite
  steps:
    - name: Versión de Playwright
      id: version
      shell: bash
      run: echo "value=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    # La clave empieza por `playwright-`: el job `limpiar-cache` de e2e.yml borra por ese prefijo.
    - name: Caché de navegadores
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.value }}
    - name: Instalar Chromium
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Instalar solo dependencias del sistema (navegador en caché)
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
