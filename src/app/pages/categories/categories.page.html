<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button />
    </ion-buttons>
    <ion-title>Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (store.categories().length) {
    <ion-list>
      @for (c of store.categories(); track c.id) {
        <ion-item-sliding #sliding>
          <ion-item button detail="false" (click)="edit(c)">
            <span slot="start" class="dot" [style.background]="c.color"></span>
            <ion-label>
              <h2>{{ c.name }}</h2>
              <p>{{ taskCount(c.id) }} tarea(s)</p>
            </ion-label>
            <ion-button
              slot="end"
              fill="clear"
              (click)="$event.stopPropagation(); showTasks(c)"
              aria-label="Ver tareas de esta categoría"
            >
              <ion-icon slot="icon-only" name="funnel-outline" />
            </ion-button>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option (click)="sliding.close(); edit(c)">
              <ion-icon slot="icon-only" name="create-outline" aria-label="Editar" />
            </ion-item-option>
            <ion-item-option color="danger" (click)="sliding.close(); remove(c)">
              <ion-icon slot="icon-only" name="trash-outline" aria-label="Eliminar" />
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
    <ion-note class="hint">Toca para editar · desliza para eliminar</ion-note>
  } @else {
    <div class="empty">
      <ion-icon name="pricetags-outline" aria-hidden="true" />
      <p>No hay categorías. Crea una con el botón +.</p>
    </div>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="create()" aria-label="Nueva categoría">
      <ion-icon name="add" />
    </ion-fab-button>
  </ion-fab>
</ion-content>
