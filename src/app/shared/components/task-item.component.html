<ion-item-sliding #sliding>
  <ion-item class="task-item__item" lines="full" [class.task-item__item--done]="task().completed">
    <ion-checkbox
      slot="start"
      [checked]="task().completed"
      (ionChange)="toggle.emit(task().id)"
      [attr.aria-label]="task().completed ? 'Marcar como pendiente' : 'Marcar como completada'"
    />
    <ion-label class="task-item__label ion-text-nowrap" (click)="edit.emit(task())">
      <h2 class="task-item__title">{{ task().title }}</h2>
      @if (showCategory()) {
        @if (category(); as c) {
          <p class="task-item__category">
            <span class="task-item__dot" [style.background]="c.color"></span>{{ c.name }}
          </p>
        } @else {
          <p class="task-item__category task-item__category--muted">Sin categoría</p>
        }
      }
    </ion-label>
  </ion-item>
  <ion-item-options side="end" (ionSwipe)="remove.emit(task().id)">
    <ion-item-option color="danger" expandable (click)="sliding.close(); remove.emit(task().id)">
      <ion-icon slot="icon-only" name="trash-outline" aria-label="Eliminar" />
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
